# Deploiement VPS (Hostinger KVM) avec HTTPS automatique via Caddy.
# - text-to-cad : l'appli (interne, non exposee directement).
# - caddy       : reverse-proxy en façade, obtient/renouvelle le certificat
#                 Let's Encrypt tout seul pour text-to-cad.fr.
services:
  text-to-cad:
    build: .
    expose:
      - "8009"                # interne au reseau docker (pas de port hote)
    environment:
      - GEMINI_MODEL=gemini-3.6-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Auth fédérée IDEAS + session locale
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - IDEAS_APP_NAME=text-to-cad
      - TCAD_DB=/data/text-to-cad.db
      - COOKIE_SECURE=1         # cookies Secure (on est derriere Caddy en https)
    volumes:
      - tcad_data:/data         # base SQLite persistante (comptes + etudes)
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # stockage des certificats (persistant)
      - caddy_config:/config
    depends_on:
      - text-to-cad
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  tcad_data:
