# Deploiement VPS (Hostinger KVM) : build de l'image + lancement permanent.
# Les secrets (GEMINI_API_KEY, APP_PASSWORD) sont lus depuis un fichier .env
# place a cote de ce fichier SUR LE VPS (jamais commite).
services:
  text-to-cad:
    build: .
    ports:
      - "80:8009"              # http://<IP_DU_VPS> -> l'appli
    environment:
      - GEMINI_MODEL=gemini-3.6-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_PASSWORD=${APP_PASSWORD}
    restart: unless-stopped     # redemarre tout seul (reboot, crash)
